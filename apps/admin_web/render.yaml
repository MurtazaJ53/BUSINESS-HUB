# Render deployment for the admin web application.
#
# rootDir matters: this is a monorepo and the app lives in apps/admin_web.
# The package manager is pnpm — `npm install` fails against pnpm-lock.yaml.
services:
  - type: web
    name: business-hub-admin-web
    runtime: node
    rootDir: apps/admin_web
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production

      # The only variable the app actually needs.
      #
      # This replaces NEXT_PUBLIC_API_URL, which nothing in the codebase read —
      # deploying with that name would have left the app falling back to
      # http://127.0.0.1:8000/api/v1 and failing every request.
      #
      # Every API call is made server-side through the proxy routes in
      # src/app/api, so this is deliberately NOT a NEXT_PUBLIC_ variable and
      # must not become one: that would ship the backend address to the browser.
      #
      # Set to the live backend, e.g. https://api.indianwasteportal.com/api/v1
      - key: BUSINESS_HUB_API_BASE_URL
        sync: false
