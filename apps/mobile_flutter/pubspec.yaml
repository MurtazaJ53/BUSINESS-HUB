name: business_hub_mobile
description: Flutter mobile app for Business Hub.
publish_to: "none"
version: 1.3.10+10

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.2
  drift: ^2.32.1
  drift_flutter: ^0.3.0
  mobile_scanner: ^7.2.0
  package_info_plus: ^8.0.0
  esc_pos_utils_plus: ^2.0.3
  blue_thermal_printer: ^1.2.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  crypto: ^3.0.0
  path_provider: ^2.1.0
  path: ^1.9.0
  pdf: ^3.11.0
  printing: ^5.13.0
  sentry_flutter: ^9.24.0
  excel: ^4.0.6
  file_picker: ^8.1.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  qr: ^3.0.0
  local_auth: ^3.0.2
  flutter_contacts: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.14.1
  drift_dev: ^2.32.1
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0EA5E9"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter_native_splash:
  color: "#0EA5E9"
  image: "assets/icon/splash.png"
  android_12:
    color: "#0EA5E9"
    image: "assets/icon/splash.png"
