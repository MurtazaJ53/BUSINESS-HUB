version: '3.8'

services:
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=10000
      - DEFAULT_POOL_SIZE=100
    ports:
      - "6432:5432"
    depends_on:
      - db
    restart: always

  db:
    image: citusdata/citus:12.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-business_hub}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: always

  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: gunicorn config.wsgi:application -c gunicorn.conf.py
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_DEBUG=False
    ports:
      - "8000:8000"
    depends_on:
      - pgbouncer
      - redis
    restart: always

  celery_default:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: celery -A config worker -Q default,migration,reconciliation -l info -c 4
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_DEBUG=False
    depends_on:
      - pgbouncer
      - redis
    restart: always

  celery_erpnext:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: celery -A config worker -Q erpnext-sync -l info -c 2
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_DEBUG=False
    depends_on:
      - pgbouncer
      - redis
    restart: always

  celery_beat:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: celery -A config beat -l info
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_DEBUG=False
    depends_on:
      - redis
    restart: always

volumes:
  db_data:
  redis_data:
